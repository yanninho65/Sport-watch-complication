name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APKs (wear + mobile)
        run: gradle :wear:assembleDebug :mobile:assembleDebug --no-daemon

      - name: Upload wear APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug
          path: wear/build/outputs/apk/debug/*.apk

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug
          path: mobile/build/outputs/apk/debug/*.apk
